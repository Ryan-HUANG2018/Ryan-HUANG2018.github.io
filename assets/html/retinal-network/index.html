<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Retinal arterial network viewer</title>
    <script>
      (function () {
        var t = "dark";
        try {
          t = localStorage.getItem("theme") || "dark";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
      })();
    </script>
    <!-- Plotly (gl3d bundle, v2.35.2) served next to this page so it does not depend on a CDN -->
    <script src="plotly-gl3d.min.js"></script>
    <style>
      :root {
        --bg: transparent;
        --surface: rgba(255, 255, 255, 0.04);
        --fg: #e8f1f5;
        --fg2: #8a9ba8;
        --rule: rgba(255, 255, 255, 0.12);
        --murray: #338ced;
        --ep: #e76624;
        --accent: #3fe0d0;
        --on-accent: #06080c;
        --sans: Inter, "Helvetica Neue", Arial, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
        color-scheme: dark;
      }
      :root[data-theme="light"] {
        --surface: rgba(255, 255, 255, 0.56);
        --fg: #17191c;
        --fg2: #6b6f76;
        --rule: rgba(0, 0, 0, 0.12);
        --murray: #257de0;
        --ep: #c8551d;
        --accent: #0e8a7e;
        --on-accent: #ffffff;
        color-scheme: light;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        overflow-x: hidden;
        background: transparent;
        color: var(--fg);
        font-family: var(--sans);
        font-size: 14px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
        align-items: end;
        padding: 4px 2px 10px;
      }
      .ctl {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .lab {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--fg2);
      }
      .seg {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .seg button,
      select {
        font: inherit;
        font-size: 13px;
        padding: 5px 12px;
        border-radius: 999px;
        border: 1px solid var(--rule);
        background: var(--surface);
        color: var(--fg);
        cursor: pointer;
      }
      .seg button[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
      }
      .seg button:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .sw {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 6px;
      }
      #plot {
        width: 100%;
        height: 520px;
        border-radius: 14px;
        border: 1px solid var(--rule);
        background: var(--surface);
      }
      .note {
        font-size: 12.5px;
        color: var(--fg2);
        margin: 8px 2px 0;
      }
      .note b {
        color: var(--fg);
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <div class="ctl">
        <span class="lab" id="l-g">Outlet condition</span>
        <div class="seg" role="group" aria-labelledby="l-g" id="g-group">
          <button id="g-murray" data-v="MurrayLaw" aria-pressed="false">
            <span class="sw" style="background: var(--murray)"></span>Murray split
          </button>
          <button id="g-ep" data-v="NonMurrayLaw" aria-pressed="true"><span class="sw" style="background: var(--ep)"></span>Equal pressure</button>
        </div>
      </div>
      <div class="ctl">
        <span class="lab" id="l-f">Field</span>
        <div class="seg" role="group" aria-labelledby="l-f" id="g-field">
          <button id="f-p" data-v="p" aria-pressed="true">Pressure</button>
          <button id="f-wss" data-v="WSS" aria-pressed="false">WSS</button>
          <button id="f-u" data-v="U" aria-pressed="false">|u|</button>
          <button id="f-q" data-v="ratio" aria-pressed="false">Flow change</button>
        </div>
      </div>
      <div class="ctl">
        <label class="lab" for="iop">IOP (mmHg)</label
        ><select id="iop"></select>
      </div>
    </div>
    <div id="plot" role="img" aria-label="Interactive 3-D view of the retinal arterial network coloured by the selected field"></div>
    <p class="note" id="legend-note"></p>
    <script>
      (function () {
        const state = { g: "NonMurrayLaw", f: "p", iop: "13" };
        let D = null;
        const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
        const VIRIDIS = "Viridis";
        const DIV = [
          [0, "#0e3d7e"],
          [0.25, "#519ced"],
          [0.5, "#bdbdbd"],
          [0.75, "#f08a8b"],
          [1, "#a3191a"],
        ];
        const FIELD = {
          p: { key: "p", title: "Pressure (mmHg)", log: false },
          WSS: { key: "WSS", title: "WSS (Pa)", log: true },
          U: { key: "U", title: "|u| (mm/s)", log: true },
          ratio: { title: "log₂(Q_EP / Q_Murray)" },
        };

        function widthClass(r) {
          return r < 15 ? 0 : r < 25 ? 1 : r < 40 ? 2 : 3;
        }
        const WIDTHS = [2.5, 4.5, 7, 10];

        function sharedRange(f) {
          let lo = Infinity,
            hi = -Infinity;
          for (const g of D.groups)
            for (const seg of D.flow[g][state.iop])
              for (const v of seg[FIELD[f].key]) {
                if (FIELD[f].log && v <= 0) continue;
                if (v < lo) lo = v;
                if (v > hi) hi = v;
              }
          return [lo, hi];
        }

        function buildTraces() {
          const f = state.f;
          const per = D.flow[state.g][state.iop];
          const groups = [0, 1, 2, 3].map(() => ({ x: [], y: [], z: [], c: [], t: [] }));
          let cmin,
            cmax,
            colorscale = VIRIDIS,
            tickvals,
            ticktext;
          let ratio = null;
          if (f === "ratio") {
            const m = D.flow.MurrayLaw[state.iop],
              e = D.flow.NonMurrayLaw[state.iop];
            ratio = m.map((s, i) => (s.Q && e[i].Q && s.Q > 0 && e[i].Q > 0 ? Math.log2(e[i].Q / s.Q) : 0));
            const lim = Math.ceil(Math.max(...ratio.map(Math.abs)));
            cmin = -lim;
            cmax = lim;
            colorscale = DIV;
          } else {
            [cmin, cmax] = sharedRange(f);
            if (f === "p") cmin = Math.max(cmin, 0);
            if (FIELD[f].log) {
              const a = Math.floor(Math.log10(cmin)),
                b = Math.ceil(Math.log10(cmax));
              tickvals = [];
              ticktext = [];
              for (let k = a; k <= b; k++) {
                tickvals.push(k);
                ticktext.push(k >= 0 ? String(10 ** k) : (10 ** k).toPrecision(1));
              }
              cmin = Math.log10(cmin);
              cmax = Math.log10(cmax);
            }
          }
          D.segments.forEach((s, i) => {
            const d = per[i];
            const meanR = d.r.reduce((a, b) => a + b, 0) / d.r.length;
            const G = groups[widthClass(meanR)];
            s.xyz.forEach((p, j) => {
              G.x.push(p[0]);
              G.y.push(p[1]);
              G.z.push(p[2]);
              let v, label;
              if (f === "ratio") {
                v = ratio[i];
                label = `log₂ ratio ${v.toFixed(2)}`;
              } else {
                const raw = d[FIELD[f].key][j];
                label = `${FIELD[f].title.split(" (")[0]} ${raw.toFixed(2)} ${FIELD[f].title.match(/\((.*)\)/)[1]}`;
                v = FIELD[f].log ? Math.log10(Math.max(raw, 1e-3)) : raw;
              }
              G.c.push(v);
              G.t.push(
                `Seg ${s.id}${s.terminal ? " (terminal)" : ""}<br>${label}<br>r ${d.r[j]} µm${d.Q !== null ? `<br>Q ${d.Q.toFixed(3)} µL/min` : ""}`
              );
            });
            G.x.push(null);
            G.y.push(null);
            G.z.push(null);
            G.c.push(null);
            G.t.push("");
          });
          const fg = css("--fg");
          return groups.map((G, k) => ({
            type: "scatter3d",
            mode: "lines",
            x: G.x,
            y: G.y,
            z: G.z,
            text: G.t,
            hoverinfo: "text",
            connectgaps: false,
            line: {
              width: WIDTHS[k],
              color: G.c,
              colorscale,
              cmin,
              cmax,
              showscale: k === 3,
              colorbar: {
                title: { text: FIELD[f].title, side: "right", font: { color: fg, size: 12 } },
                thickness: 12,
                len: 0.6,
                tickfont: { color: fg, size: 11 },
                outlinewidth: 0,
                tickvals,
                ticktext,
              },
            },
            showlegend: false,
          }));
        }

        function layout() {
          const fg2 = css("--fg2"),
            surf = css("--surface");
          const ax = (t) => ({
            title: { text: t, font: { color: fg2, size: 11 } },
            color: fg2,
            showbackground: false,
            gridcolor: css("--rule"),
            zeroline: false,
            tickfont: { size: 10 },
          });
          return {
            paper_bgcolor: "rgba(0,0,0,0)",
            plot_bgcolor: "rgba(0,0,0,0)",
            margin: { l: 0, r: 0, t: 0, b: 0 },
            scene: {
              xaxis: ax("x (mm)"),
              yaxis: ax("y (mm)"),
              zaxis: ax("z (mm)"),
              aspectmode: "data",
              camera: { eye: { x: 0, y: 0, z: 1.6 }, up: { x: 0, y: -1, z: 0 } },
            },
            font: { family: css("--sans") },
          };
        }

        function note() {
          const n = document.getElementById("legend-note");
          const g = state.g === "MurrayLaw" ? "Murray split" : "Equal pressure";
          if (state.f === "ratio")
            n.innerHTML = `<b>Flow change</b> compares the two outlet conditions segment by segment at IOP ${state.iop} mmHg; red means more flow under equal pressure. The outlet-condition switch does not apply to this view.`;
          else if (state.f === "p")
            n.innerHTML = `<b>${g}</b>, IOP ${state.iop} mmHg. Pressure colour scale is shared by both outlet conditions and clipped at 0 mmHg. Line width shows four radius classes. Drag to rotate; hover for segment values.`;
          else
            n.innerHTML = `<b>${g}</b>, IOP ${state.iop} mmHg. Log colour scale shared by both outlet conditions. Line width shows four radius classes. Drag to rotate; hover for segment values.`;
        }

        function draw(first) {
          const t = buildTraces();
          if (first)
            Plotly.newPlot("plot", t, layout(), {
              responsive: true,
              displaylogo: false,
              modeBarButtonsToRemove: ["toImage"],
              displayModeBar: "hover",
            });
          else
            Plotly.react(
              "plot",
              t,
              Object.assign(layout(), { scene: Object.assign(layout().scene, { camera: document.getElementById("plot")._fullLayout.scene.camera }) })
            );
          note();
        }

        function wire(groupId, key) {
          document.getElementById(groupId).addEventListener("click", (e) => {
            const b = e.target.closest("button");
            if (!b) return;
            state[key] = b.dataset.v;
            for (const x of document.querySelectorAll(`#${groupId} button`)) x.setAttribute("aria-pressed", String(x === b));
            draw(false);
          });
        }

        fetch("network.json")
          .then((r) => {
            if (!r.ok) throw new Error("network.json: HTTP " + r.status);
            return r.json();
          })
          .then((d) => {
            D = d;
            const sel = document.getElementById("iop");
            for (const i of d.iops) {
              const o = document.createElement("option");
              o.value = String(i);
              o.textContent = i;
              sel.appendChild(o);
            }
            sel.value = state.iop;
            sel.addEventListener("change", () => {
              state.iop = sel.value;
              draw(false);
            });
            wire("g-group", "g");
            wire("g-field", "f");
            draw(true);
            window.addEventListener("storage", (e) => {
              if (e.key === "theme") {
                document.documentElement.setAttribute("data-theme", e.newValue === "light" ? "light" : "dark");
                draw(false);
              }
            });
          })
          .catch((err) => {
            const msg = typeof Plotly === "undefined" ? "the plotting library did not load" : String(err && err.message ? err.message : err);
            document.getElementById("plot").innerHTML =
              '<p style="padding:16px">The interactive network could not be shown (' + msg.replace(/</g, "&lt;") + "). Try reloading the page.</p>";
          });
      })();
    </script>
  </body>
</html>
